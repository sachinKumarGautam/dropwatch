name: check-prices

# Hourly (public repo = free Actions minutes) so per-URL "hourly" frequency is honored.
# The per-product frequency gate decides who actually gets scraped, so a daily-default
# URL still costs ~1 scrape/day even though the workflow runs every hour.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      product_id:
        description: "Check a single product (leave blank for all)"
        required: false
        type: string

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRY_RUN: "0"
      MINIMAL_LLM: "1"
      DISABLE_LLM_EXTRACT: ${{ vars.DISABLE_LLM_EXTRACT || '1' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'openai' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      LLM_REASONING_MODEL: ${{ vars.LLM_REASONING_MODEL || 'gpt-4o-mini' }}
      DEFAULT_PINCODE: ${{ vars.DEFAULT_PINCODE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - name: Install Playwright chromium (best-effort; Amazon/Flipkart use Firecrawl)
        continue-on-error: true
        run: pnpm --filter @dropwatch/core exec playwright install --with-deps chromium

      - name: Check prices
        run: |
          if [ -n "${{ github.event.inputs.product_id }}" ]; then
            pnpm --filter @dropwatch/worker start -- check "${{ github.event.inputs.product_id }}"
          else
            pnpm --filter @dropwatch/worker start -- check-all
          fi

      # digest once a day, at ~09:00 IST (03:xx UTC)
      - name: Daily digest (09:00 IST)
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            pnpm --filter @dropwatch/worker start -- digest
          else
            echo "not the digest hour ($(date -u +%H) UTC) — skipping"
          fi
